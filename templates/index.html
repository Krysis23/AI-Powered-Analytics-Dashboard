<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataLens AI</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>

<header>
  <h1>DataLens AI</h1>
  <p>Upload any dataset — clean, visualise, and query with AI</p>
</header>

<main>
  <!-- Step 1: Upload -->
  <section id="section-upload" class="card">
    <h2>1 · Upload your dataset</h2>
    <div id="drop-zone">
      <p>Drag & drop CSV or Excel here</p>
      <p>or <label for="file-input" class="link">browse files</label></p>
      <input type="file" id="file-input" accept=".csv,.xlsx,.xls" hidden>
    </div>
    <div id="upload-status" class="hidden"></div>
    <div id="preview-table" class="hidden"></div>
  </section>

  <!-- Step 2: Profile -->
  <section id="section-profile" class="card hidden">
    <h2>2 · Dataset profile</h2>
    <div id="profile-stats" class="stats-row"></div>
    <div id="profile-table"></div>
  </section>

  <!-- Step 3: Clean -->
  <section id="section-clean" class="card hidden">
    <h2>3 · Data cleaning</h2>
    <div class="clean-controls">
      <label><input type="checkbox" id="drop-dupes" checked> Remove duplicate rows</label>
      <label><input type="checkbox" id="parse-dates" checked> Parse date columns</label>
      <label><input type="checkbox" id="drop-ids" checked> Drop ID-like columns</label>
      <label><input type="checkbox" id="remove-outliers"> Remove outliers</label>
      <div class="select-group">
        <label>Fill missing numeric values with</label>
        <select id="null-strategy">
          <option value="fill_median">Median (recommended)</option>
          <option value="fill_mean">Mean</option>
          <option value="fill_zero">Zero</option>
          <option value="drop_rows">Drop row</option>
        </select>
      </div>
      <div class="select-group">
        <label>Drop column if missing > <span id="thresh-val">60</span>%</label>
        <input type="range" id="null-threshold" min="10" max="100" value="60" step="5">
      </div>
    </div>
    <button id="btn-clean" class="btn-primary">Apply cleaning</button>
    <div id="clean-report" class="hidden"></div>
    <a id="btn-download" class="btn-secondary hidden" href="/api/download">
      Download cleaned CSV
    </a>
  </section>

  <!-- Step 4: Charts -->
  <section id="section-charts" class="card hidden">
    <h2>4 · Visualisations</h2>
    <div class="chart-controls">
      <select id="chart-type">
        <option>bar</option><option>line</option><option>scatter</option>
        <option>histogram</option><option>box</option><option>pie</option>
      </select>
      <select id="chart-x"></select>
      <select id="chart-y"></select>
      <select id="chart-color"></select>
      <button id="btn-chart" class="btn-primary">Generate chart</button>
    </div>
    <div id="chart-container"></div>
  </section>

  <!-- Step 5: NL Query -->
  <section id="section-nl" class="card hidden">
    <h2>5 · Ask your data</h2>
    <div class="nl-input-row">
      <input type="text" id="nl-input" placeholder="e.g. top 5 categories by total sales">
      <button id="btn-nl" class="btn-primary">Ask</button>
    </div>
    <div id="nl-result"></div>
    <div id="nl-chart"></div>
  </section>
</main>

<script src="/static/js/upload.js"></script>
<script src="/static/js/clean.js"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/nlquery.js"></script>
</body>
</html>
